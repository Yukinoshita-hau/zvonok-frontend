services:
  production-guard:
    image: node:22.14.0-alpine
    restart: 'no'
    command: [node, /ops/production-guard.cjs]
    network_mode: none
    labels: {io.zvonok.deployment: stage5e}
    volumes: ['./production-guard.cjs:/ops/production-guard.cjs:ro']
    environment:
      APP_URL: ${APP_URL:?Required}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?Required}
      LIVEKIT_HTTP_URL: ${LIVEKIT_HTTP_URL:?Required}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?Required}
      WS_PUBLIC_URL: ${WS_PUBLIC_URL:?Required}
      COOKIE_SECURE: ${COOKIE_SECURE:?Required}
      ALLOW_LOOPBACK_HTTP: ${ALLOW_LOOPBACK_HTTP:?Required}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:?Required}
      JWT_SECRET: ${JWT_SECRET:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Required}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Required}
  postgres:
    depends_on:
      production-guard: {condition: service_completed_successfully}
  redis:
    depends_on:
      production-guard: {condition: service_completed_successfully}
  rustfs:
    depends_on:
      production-guard: {condition: service_completed_successfully}
  livekit:
    depends_on:
      production-guard: {condition: service_completed_successfully}
  frontend:
    depends_on:
      production-guard: {condition: service_completed_successfully}
  caddy:
    ports: ['80:80', '443:443']
    depends_on:
      production-guard: {condition: service_completed_successfully}

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
        VITE_PRIVATE_MEDIA_STREAMING: ${VITE_PRIVATE_MEDIA_STREAMING:-false}
        VITE_BROWSER_ACTIVITY: ${VITE_BROWSER_ACTIVITY:-false}
    container_name: zvonok-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    env_file:
      - .env
